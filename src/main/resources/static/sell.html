<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>发布图书</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/auth.js"></script>

<script src="js/navbar.js"></script>

<h2>发布图书</h2>

<form id="sellForm">

    ISBN：
    <input type="text" id="isbn"><br><br>

    书名：
    <input type="text" id="bookName"><br><br>

    价格：
    <input type="number" id="price"><br><br>

    联系方式：
    <input type="text" id="contact"><br><br>

    成色：
    <select id="conditionLevel">
        <option>全新</option>
        <option>微瑕</option>
        <option>较旧</option>
        <option>破损</option>
    </select>

    <br><br>

    <button type="submit">
        发布
    </button>

</form>

<script src="js/sell.js"></script>

</body>
</html>
