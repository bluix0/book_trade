<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>发布图书</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>

<div class="container sell-container">
    <div class="welcome-card">
        <h2>发布图书</h2>
        <p>填写图书信息后即可发布</p>
    </div>

    <form id="sellForm" class="sell-form">
        <label>ISBN</label>
        <input type="text" id="isbn" required placeholder="例如：9787115533490">

        <label>书名</label>
        <input type="text" id="bookName" required placeholder="请输入书名">

        <label>价格（元）</label>
        <input type="number" id="price" step="0.01" min="0" required placeholder="0.00">

        <label>联系方式</label>
        <input type="text" id="contact" required placeholder="手机号/微信号/QQ">

        <label>成色</label>
        <select id="conditionLevel">
            <option>全新</option>
            <option>微瑕</option>
            <option>较旧</option>
            <option>破损</option>
        </select>

        <button type="submit" id="sellBtn">发布图书</button>
    </form>
</div>

<script src="js/sell.js"></script>

</body>
</html>
